<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>일반 출판사 시장 지도 2026</title>
<link rel="stylesheet" href="app.css">
<style>
.vis img.hcv{height:96px;width:auto;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.vis img.hth2{flex:1 1 0;min-width:0;height:96px;object-fit:cover;object-position:top;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.stage,.cellbtn{cursor:pointer;font:inherit}
</style>
</head>
<body>
<section class="app-sec"><div class="home" id="home"></div></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script>
APPX.start('home', function () {
  const H = window.HOME, C = H.cover, PR = H.promo, S = H.sns, R = H.reports, esc = APPX.esc;
  const P = C.pubs, books = C.books, latest = R[0] || { findings: [], profiles: [], report_date: '' };
  const snsN = id => { const s = S.sns[id]; return s ? s[0] + s[1] + s[2] : 0; };
  const fmt = n => Number(n).toLocaleString();
  const avgScr = PR.imgs.length ? (PR.imgs.reduce((a, x) => a + x.screens, 0) / PR.imgs.length).toFixed(1) : '-';
  const pl = S.plat, plt = (pl.ig + pl.x + pl.th) || 1, PLN = { ig: '인스타그램', x: 'X', th: '스레드' };
  const withSns = books.filter(b => snsN(b.id) > 0).length;
  const prof = Object.fromEntries(latest.profiles.map(p => [p.pub, p]));
  const CS = Object.fromEntries(C.styles.map(s => [s.id, s]));
  let h = '<div class="hero"><h1>일반 출판사 시장 지도 2026</h1><p>' + P.map(esc).join(', ') + '가 2026년에 낸 책 ' + books.length + '종을 표지, 상세페이지, SNS 홍보 순서로 따라갑니다. 마지막 단계는 이 자료로 쓴 홍보 전략 보고서입니다.</p><div class="meta">' + esc(C.meta.range || '') + ' · SNS 수집일 ' + esc(H.snsMeta.collected || '') + '</div></div>';
  h += '<div class="flow">' +
    '<button class="stage" data-href="cover.html"><span class="eb">1단계</span><h3>표지 지도</h3><div class="vis">' + H.top.map(b => '<img class="hcv" src="' + MEDIA('covers_s/' + b.id + '.jpg') + '" alt="' + esc(b.title) + ' 표지">').join('') + '</div><div class="nums"><div><b>' + books.length + '종</b><span>표지</span></div><div><b>' + C.styles.length + '가지</b><span>표지 스타일</span></div></div><p>표지를 첫인상 스타일로 나누고 출판사마다 비교합니다.</p><span class="go">표지 지도 열기</span></button>' +
    '<button class="stage" data-href="promo.html"><span class="eb">2단계</span><h3>상세페이지 지도</h3><div class="vis">' + H.th.map(x => '<img class="hth2" src="' + MEDIA('thumbs/' + x.file) + '" alt="">').join('') + '</div><div class="nums"><div><b>' + PR.imgs.length + '장</b><span>상세페이지</span></div><div><b>' + avgScr + '화면</b><span>평균 길이(휴대폰)</span></div></div><p>알라딘 출판사 제공 책소개 이미지를 첫 화면과 구성 요소로 나눕니다.</p><span class="go">상세페이지 지도 열기</span></button>' +
    '<button class="stage" data-href="sns.html"><span class="eb">3단계</span><h3>SNS 홍보 지도</h3><div class="vis plat"><div class="pbar">' + ['ig', 'x', 'th'].map(k => '<i style="width:' + pl[k] / plt * 100 + '%;background:var(--' + k + ')"></i>').join('') + '</div><div class="plg">' + ['ig', 'x', 'th'].map(k => '<span><i style="background:var(--' + k + ')"></i>' + PLN[k] + ' ' + fmt(pl[k]) + '</span>').join('') + '</div></div><div class="nums"><div><b>' + fmt(S.posts) + '건</b><span>책을 소개한 게시물</span></div><div><b>' + withSns + '종</b><span>SNS에 소개된 책</span></div></div><p>공식 계정 ' + S.accounts + '곳의 게시물을 책과 짝지어 홍보 시점과 방식을 봅니다.</p><span class="go">SNS 홍보 지도 열기</span></button>' +
    '<button class="stage" data-href="report.html"><span class="eb">4단계</span><h3>홍보 전략 보고서</h3><div class="vis quote"><q>' + esc(latest.findings[0] || '') + '</q></div><div class="nums"><div><b>' + latest.findings.length + '가지</b><span>핵심 발견</span></div><div><b>' + latest.profiles.length + '곳</b><span>출판사 전략 프로필</span></div></div><p>세 지도에서 읽은 출판사별 홍보 전략과 시사점입니다.</p><span class="go">보고서 열기</span></button>' +
    '</div>';
  h += '<h2>출판사 한눈에 보기</h2><p class="lede">출판사마다 네 지도의 핵심 값을 한 줄에 모았습니다. 홍보 전략 유형을 누르면 보고서의 해당 대목이 열립니다.</p><div class="tblx"><table class="pt"><thead><tr><th>출판사</th><th>가장 많이 쓴 표지 스타일</th><th>상세페이지를 붙인 도서</th><th>SNS에 소개된 도서</th><th>홍보 전략 유형</th></tr></thead><tbody>';
  const bar = (a, t) => '<span class="mbar"><span class="tr"><i style="width:' + (t ? a / t * 100 : 0) + '%"></i></span><span class="v">' + a + ' / ' + t + '종</span></span>';
  P.forEach(p => {
    const L = books.filter(b => b.pub === p), cnt = {}; L.forEach(b => cnt[b.style] = (cnt[b.style] || 0) + 1);
    const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0], cv = PR.coverage[p] || { with: 0, total: L.length }, sn = L.filter(b => snsN(b.id) > 0).length, pf = prof[p];
    h += '<tr><th scope="row"><span class="lbl">' + esc(p) + '</span> <small>' + L.length + '종</small></th>' +
      '<td>' + (top ? '<span class="lbl">' + esc((CS[top[0]] || {}).ko || top[0]) + '</span> <small>' + top[1] + '종 · ' + Math.round(top[1] / L.length * 100) + '%</small>' : '') + '</td>' +
      '<td>' + bar(cv.with, cv.total) + '</td><td>' + bar(sn, L.length) + '</td>' +
      '<td>' + (pf ? '<button class="cellbtn" data-href="report.html#' + encodeURIComponent(pf.id) + '"><span class="lbl"><span class="tag">' + esc(pf.type) + '</span></span><small>' + esc(pf.line) + '</small></button>' : '') + '</td></tr>';
  });
  h += '</tbody></table></div>';
  h += '<h2>원본 대시보드</h2><p class="lede">이 화면은 아래 네 링크의 자료를 옮겨 만든 것입니다. 원본 링크는 그대로 남아 있습니다.</p><div class="orig">' +
    [['https://claude.ai/artifact/8u4LxwpWyhVcbt8VzxH79Q', '표지 지도 2026'], ['https://claude.ai/artifact/E3QeWVPo5ST6kQzJbTBBuB', '상세페이지 지도 2026'], ['https://claude.ai/artifact/UFPR6BVdpwykn5dauQBzV5', 'SNS 홍보 지도 2026'], ['https://claude.ai/artifact/Y6WDkBMhwAtWyRZHZUiejb', '출판사별 SNS 홍보 전략 보고서 2026']]
      .map(([u, t]) => '<a href="' + u + '" target="_blank" rel="noopener"><b>' + t + '</b></a>').join('') + '</div>';
  h += '<p class="homefoot">' + esc(C.meta.source || '') + '</p>';
  document.getElementById('home').innerHTML = h;
  document.addEventListener('click', e => { const b = e.target.closest('[data-href]'); if (b) location.href = b.dataset.href; });
});
</script>
</body>
</html>

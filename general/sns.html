<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SNS 홍보 지도 2026</title>
<style>
/* 표지 지도와 같은 무채색 바탕. 플랫폼 세 가지만 색을 갖고, 강조색은 선택 상태에만 쓴다 */
:root{
  --bg:#eceef0; --surface:#f8f9fa; --line:#d5d9dd; --ink:#15191e; --ink2:#4d555e; --ink3:#747d87;
  --accent:#0b5c6b; --accent-soft:#d6e7ea; --on-accent:#ffffff;
  --ig:#b23a6a; --x:#2f3640; --th:#6b55b0; --ig-soft:#f3dde6; --x-soft:#dfe2e6; --th-soft:#e6e0f3;
  --serif:"Noto Serif KR","AppleMyungjo","Nanum Myeongjo",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171a; --surface:#1c2024; --line:#30363c; --ink:#eef0f2; --ink2:#b3bac2; --ink3:#8a929b;
  --accent:#6cc4d3; --accent-soft:#17383f; --on-accent:#08242a;
  --ig:#ec7aa6; --x:#c9d0d8; --th:#a995e6; --ig-soft:#3d2230; --x-soft:#2a3038; --th-soft:#2d2640; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171a; --surface:#1c2024; --line:#30363c; --ink:#eef0f2; --ink2:#b3bac2; --ink3:#8a929b;
  --accent:#6cc4d3; --accent-soft:#17383f; --on-accent:#08242a;
  --ig:#ec7aa6; --x:#c9d0d8; --th:#a995e6; --ig-soft:#3d2230; --x-soft:#2a3038; --th-soft:#2d2640; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;padding:20px 20px 0;border-bottom:1px solid var(--line)}
.brand h1{font:700 26px/1.2 var(--serif);margin:0;letter-spacing:-.01em}
.brand p{margin:3px 0 12px;color:var(--ink2);font-size:13px}
nav.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:9px 16px;border-bottom:3px solid transparent;color:var(--ink2);font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.view[hidden]{display:none}

/* 도서별 */
.browse{display:grid;grid-template-columns:260px minmax(0,1fr)}
aside.filters{border-right:1px solid var(--line);padding:16px 14px 40px 20px;position:sticky;top:0;max-height:100vh;overflow:auto}
.fgroup{margin-bottom:18px}
.fgroup h3{font-size:12px;letter-spacing:.04em;color:var(--ink3);margin:0 0 6px;font-weight:700}
.opt{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:4px 7px;border-radius:5px;text-align:left;color:var(--ink)}
.opt:hover{background:var(--line)}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.opt .c{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12px;opacity:.75}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.ig{background:var(--ig)} .dot.x{background:var(--x)} .dot.th{background:var(--th)}
.shelf{padding:16px 20px 60px;min-width:0}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar input[type=search]{flex:1 1 240px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.count{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px}
.reset{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 11px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px;text-align:left;width:100%;color:var(--ink)}
.card:hover{border-color:var(--ink3)}
.card img,.card .noimg{width:58px;height:84px;object-fit:cover;border-radius:3px;background:var(--line);display:block}
.card .t{font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:12px;color:var(--ink3);margin:2px 0 6px}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 7px;border-radius:10px;font-variant-numeric:tabular-nums}
.chip.ig{background:var(--ig-soft);color:var(--ig)} .chip.x{background:var(--x-soft);color:var(--x)} .chip.th{background:var(--th-soft);color:var(--th)}
.chip.none{background:none;color:var(--ink3);padding-left:0}
.strip{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:7px;background:var(--line)}
.strip i{display:block;height:100%}
.dl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.dl[hidden]{display:none}
.dl button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 11px;font-size:12.5px}
.dl button:hover{border-color:var(--ink3)}
.dl button:disabled{opacity:.6;cursor:progress}
.dlmsg{font-size:12px;color:var(--ink2)}
.more{margin:16px auto 0;display:block;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:9px 18px}

/* 상세 */
dialog{border:0;border-radius:12px;padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,18,.55)}
.dhead{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:16px;padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.dhead img{width:84px;border-radius:3px;display:block}
.dhead h2{font:700 20px/1.3 var(--serif);margin:0 0 4px}
.dhead .m{color:var(--ink2);font-size:13px}
.close{border:0;background:none;font-size:22px;line-height:1;color:var(--ink2);align-self:start;padding:2px 6px}
.dsum{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.dsum b{font-size:20px;font-variant-numeric:tabular-nums}
.dsum span{display:block;font-size:12px;color:var(--ink3)}
.dfilter{display:flex;gap:6px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dfilter button{border:1px solid var(--line);background:none;border-radius:14px;padding:3px 11px;font-size:12.5px}
.dfilter button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tl{list-style:none;margin:0;padding:6px 18px 18px;overflow:auto;max-height:calc(100vh - 290px)}
.tl li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl .when{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tl .when b{display:block;color:var(--ink);font-size:13px}
.tl .who{font-size:12px;color:var(--ink3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tl .txt{margin:3px 0 4px}
.tl .eng{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.plabel{font-weight:700;font-size:11.5px;padding:0 6px;border-radius:8px}
.plabel.ig{background:var(--ig-soft);color:var(--ig)} .plabel.x{background:var(--x-soft);color:var(--x)} .plabel.th{background:var(--th-soft);color:var(--th)}
.empty{padding:28px 18px;color:var(--ink2)}

/* 비교·시점 */
.page{padding:18px 20px 60px;max-width:1180px}
.page h2{font:700 19px/1.3 var(--serif);margin:26px 0 4px}
.page h2:first-child{margin-top:4px}
.lede{color:var(--ink2);margin:0 0 12px;font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:6px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.tile b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:12.5px;color:var(--ink2)}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:12px;color:var(--ink3);font-weight:700}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.cov{display:flex;align-items:center;gap:8px;min-width:150px}
.cov .track{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.cov .fill{height:100%}
.cov .v{width:38px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.stack{display:flex;height:22px;border-radius:4px;overflow:hidden;min-width:260px}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:8px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.heat td.h{text-align:center;font-variant-numeric:tabular-nums;font-size:12.5px}
.toplist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:9px}
.toplist li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:center}
.toplist li:last-child{border-bottom:0}
.toplist .rk{color:var(--ink3);font-variant-numeric:tabular-nums}
.toplist .bk{font-size:12px;color:var(--ink3)}
.toplist .ex{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline;text-underline-offset:2px}
.note{font-size:12.5px;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-top:22px}
.note ul{margin:6px 0 0;padding-left:18px}

@media (max-width:820px){
  .browse{grid-template-columns:minmax(0,1fr)}
  .browse>*{min-width:0}
  .bar select{flex:1 1 auto}
  aside.filters{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}
  aside.filters .fgroup{margin-bottom:10px}
  .fgroup .opts{display:flex;flex-wrap:wrap;gap:4px}
  .fgroup .opt{width:auto;border:1px solid var(--line)}
  .shelf,.page{padding-left:16px;padding-right:16px}
  header.top{padding:16px 16px 0}
  nav.tabs{margin-left:0}
  .grid{grid-template-columns:minmax(0,1fr)}
  .dhead{grid-template-columns:64px minmax(0,1fr) auto}
  .dhead img{width:64px}
  .tl li{grid-template-columns:1fr;gap:2px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>SNS 홍보 지도 2026</h1>
    <p>표지 지도 560종을 6개 출판사 공식 인스타그램·X·스레드 게시물과 짝지었습니다 · 수집일 2026-11-11</p>
    <div class="dl" id="dl" hidden>
      <button id="dlZip">전체 파일 내려받기 (ZIP)</button>
      <button id="dlCsv">게시물 목록 내려받기 (CSV)</button>
      <span class="dlmsg" id="dlMsg" role="status"></span>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-v="books">도서별 홍보</button>
    <button role="tab" aria-selected="false" data-v="pubs">출판사 비교</button>
    <button role="tab" aria-selected="false" data-v="timing">홍보 시점·방식</button>
  </nav>
</header>

<main>
<section class="view" id="v-books">
  <div class="browse">
    <aside class="filters" id="filters"></aside>
    <div class="shelf">
      <div class="bar">
        <input type="search" id="q" placeholder="제목·저자·게시물 문구 검색" aria-label="검색">
        <select id="sort" aria-label="정렬">
          <option value="n">게시물 많은 순</option>
          <option value="date">출간일 최신 순</option>
          <option value="eng">X 반응 많은 순</option>
          <option value="span">홍보 기간 긴 순</option>
        </select>
        <button class="reset" id="reset">조건 지우기</button>
        <span class="count" id="count"></span>
      </div>
      <div class="grid" id="grid"></div>
      <button class="more" id="more" hidden>더 보기</button>
    </div>
  </div>
</section>

<section class="view page" id="v-pubs" hidden></section>
<section class="view page" id="v-timing" hidden></section>
</main>

<dialog id="dlg" aria-labelledby="dtitle"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script>APPX.start('sns')</script>
<script type="text/plain" id="app-main">
(function(){
const SPR={"404482108":[0,165],"404483843":[165,178],"404738460":[343,178],"404740368":[521,194],"404760728":[715,192],"404770059":[907,164],"404811007":[1071,173],"404817806":[1244,182],"404844285":[1426,204],"404919725":[1630,157],"404920543":[1787,172],"404926475":[1959,183],"404962379":[2142,175],"404969423":[2317,156],"404981031":[2473,176],"404997327":[2649,192],"404998023":[2841,180],"405001119":[3021,181],"405001435":[3202,182],"405050622":[3384,186],"405068386":[3570,185],"405086525":[3755,113],"405088496":[3868,182],"405094014":[4050,166],"405346129":[4216,172],"405346315":[4388,178],"405346811":[4566,181],"405357193":[4747,167],"405410853":[4914,182],"405413625":[5096,208],"405415331":[5304,208],"405416027":[5512,208],"405422875":[5720,182],"405439877":[5902,170],"405461165":[6072,196],"405463381":[6268,196],"405488541":[6464,191],"405504504":[6655,170],"405513103":[6825,171],"405522899":[6996,181],"405591124":[7177,170],"405605432":[7347,196],"405608045":[7543,192],"405730510":[7735,176],"405739849":[7911,188],"405945276":[8099,170],"405945431":[8269,168],"405953428":[8437,190],"405963913":[8627,204],"405965054":[8831,138],"405967560":[8969,187],"406003111":[9156,170],"406003386":[9326,178],"406015996":[9504,170],"406019915":[9674,192],"406075970":[9866,180],"406082657":[10046,175],"406102834":[10221,176],"406160332":[10397,180],"406163528":[10577,176]},SPU={};
const D=window.SNS, COV=new Proxy({},{get:(t,k)=>typeof k!=='string'?undefined:MEDIA('covers_s/'+k+'.jpg')});
(function(){const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=120;const x=c.getContext('2d');for(const k in SPR){const [y,h]=SPR[k];c.height=h;x.drawImage(im,0,y,120,h,0,0,120,h);try{SPU[k]=c.toDataURL('image/jpeg',.9);}catch(e){SPU[k]='covers/'+k+'.jpg';}}if(typeof renderBooks==='function')renderBooks();const g=document.getElementById('dlg');if(g&&g.open&&g.dataset.id){g.close();openBook(g.dataset.id);}};/* 표지는 한 장씩 읽는다 */})();
const PUBS=['문학동네','민음사','창비','문학과지성사','김영사','위즈덤하우스'];
const PL={ig:'인스타그램',x:'X',th:'스레드'};
const PLS=['ig','x','th'];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5;

// 도서별로 게시물 묶기
const B={}; D.books.forEach(b=>{B[b.id]=Object.assign(b,{posts:[],n:{ig:0,x:0,th:0},eng:0})});
D.posts.forEach((p,i)=>{p.i=i;p.b.forEach(id=>{const b=B[id];if(!b)return;b.posts.push(p);b.n[p.p]++;b.eng+=(p.l||0)+(p.r||0);});});
D.books.forEach(b=>{b.total=b.n.ig+b.n.x+b.n.th;b.posts.sort((a,c)=>a.d<c.d?-1:1);
  if(b.total){const ds=b.posts.map(p=>p.d);b.first=ds[0];b.last=ds[ds.length-1];b.span=day(b.last)-day(b.first);}else{b.span=-1;}
  b.hay=(b.title+' '+b.author+' '+b.posts.map(p=>p.t).join(' ')).toLowerCase();});
const books=D.books;

// 게시물 유형(첫머리 문구 기준)
const TYPES=[['서평단','서평단|위뷰|블라인드'],['이벤트·경품','이벤트|event|rt이벤트|증정|당첨|댓글'],['북토크·행사','북토크|낭독|사인회|강연|북콘서트|팬사인|만남|살롱|팝업|전시|도서전'],['출간·예약','출간|예약|입고|신간|출시|d-|오픈|펀딩|북펀드'],['문장·내용 소개','❝|“|"|「|미리보기|문장|발췌'],['추천·리뷰','추천|리뷰|후기|별점|선정|올해의'],['라인업·큐레이션','라인업|소개합니다|새로나온|이주의|큐레이션|모음|권|신간소식']];
const typeOf=t=>{const s=t.toLowerCase();for(const [k,re] of TYPES){if(new RegExp(re,'i').test(s))return k;}return '기타';};
D.posts.forEach(p=>p.ty=typeOf(p.t));

// 탭
document.querySelectorAll('nav.tabs button').forEach(bt=>bt.onclick=()=>{
  document.querySelectorAll('nav.tabs button').forEach(x=>x.setAttribute('aria-selected',x===bt));
  document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='v-'+bt.dataset.v);
  if(bt.dataset.v==='pubs')renderPubs(); if(bt.dataset.v==='timing')renderTiming();
});

// 필터
const st={pub:null,plat:null,band:null,cat:null,q:'',sort:'n',lim:60};
const BANDS=[['0','찾지 못함',b=>b.total===0],['1-2','1~2건',b=>b.total>=1&&b.total<=2],['3-9','3~9건',b=>b.total>=3&&b.total<=9],['10+','10건 이상',b=>b.total>=10]];
const cats=[...new Set(books.map(b=>b.cat).filter(Boolean))];
function pass(b,skip){
  if(skip!=='pub'&&st.pub&&b.pub!==st.pub)return false;
  if(skip!=='plat'&&st.plat&&!b.n[st.plat])return false;
  if(skip!=='band'&&st.band&&!BANDS.find(x=>x[0]===st.band)[2](b))return false;
  if(skip!=='cat'&&st.cat&&b.cat!==st.cat)return false;
  if(st.q&&!st.q.split(/\s+/).every(w=>b.hay.includes(w)))return false;
  return true;
}
function renderFilters(){

  const cnt=(key,fn)=>books.filter(b=>pass(b,key)&&fn(b)).length;
  document.getElementById('filters').innerHTML=

      f.file('게시물목록.csv',postsCSV());
      f.file('도서별요약.csv',booksCSV());
      f.file('읽어보기.txt','SNS 홍보 지도 2026\r\n\r\n1. 압축을 풉니다.\r\n2. index.html을 두 번 눌러 브라우저로 엽니다. 인터넷 연결 없이도 열립니다.\r\n3. 게시물목록.csv와 도서별요약.csv는 엑셀에서 열립니다.\r\n\r\n수집일: 2026-11-11\r\n');
      const ids=books.map(b=>b.id); let done=0;
      for(let i=0;i<ids.length;i+=24){
        await Promise.all(ids.slice(i,i+24).map(async id=>{
          let buf;
          if(SPR[id]){const u=SPU[id];if(!u||!u.startsWith('data:'))throw new Error('cover');buf=Uint8Array.from(atob(u.split(',')[1]),c=>c.charCodeAt(0));}
          else buf=await get('covers/'+id+'.jpg');
          f.file('covers/'+id+'.jpg',buf); done++;
        }));
        say('표지 모으는 중… '+done+'/'+ids.length);
      }
      f.file('covers/sheet.jpg',await get('covers/sheet.jpg'));
      say('압축하는 중…');
      const blob=await z.generateAsync({type:'blob',compression:'STORE'});
      say(''); await save('SNS홍보지도2026_전체파일.zip',blob);
    }catch(e){say('파일을 모으지 못했습니다. 잠시 뒤 다시 눌러 주세요.');}
    finally{bz.disabled=bc.disabled=false;}
  };
})();
})();

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>표지 지도 2026</title>
<style>
/* 배치 개념: 표지가 유일한 색이 되도록 화면은 차가운 무채색으로 물러나고, 왼쪽 필터 칸과 오른쪽 서가로 나눈다 */
:root{
  --bg:#eceef0; --surface:#f8f9fa; --line:#d5d9dd; --ink:#15191e; --ink2:#4d555e; --ink3:#747d87;
  --accent:#0b5c6b; --accent-soft:#d6e7ea; --on-accent:#ffffff;
  --heat0:#edf3f4; --heat1:#c2dbdf; --heat2:#8abcc4; --heat3:#4e98a5; --heat4:#1f7384; --heat5:#0b5163;
  --serif:"Noto Serif KR","AppleMyungjo","Nanum Myeongjo",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171a; --surface:#1c2024; --line:#30363c; --ink:#eef0f2; --ink2:#b3bac2; --ink3:#8a929b;
  --accent:#6cc4d3; --accent-soft:#17383f; --on-accent:#08242a;
  --heat0:#1c2529; --heat1:#1d3a42; --heat2:#1f5664; --heat3:#2c7b8c; --heat4:#52a5b5; --heat5:#90d0db; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171a; --surface:#1c2024; --line:#30363c; --ink:#eef0f2; --ink2:#b3bac2; --ink3:#8a929b;
  --accent:#6cc4d3; --accent-soft:#17383f; --on-accent:#08242a;
  --heat0:#1c2529; --heat1:#1d3a42; --heat2:#1f5664; --heat3:#2c7b8c; --heat4:#52a5b5; --heat5:#90d0db; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;padding:20px max(20px,env(safe-area-inset-left,0px)) 0;border-bottom:1px solid var(--line)}
.brand h1{font:700 26px/1.2 var(--serif);margin:0;letter-spacing:-.01em}
.brand p{margin:3px 0 12px;color:var(--ink2);font-size:13px}
nav.tabs{display:flex;gap:2px;margin-left:auto}
nav.tabs button{border:0;background:none;padding:9px 16px;border-bottom:3px solid transparent;color:var(--ink2);font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{display:block}
.view[hidden]{display:none}

/* 탐색 */
.browse{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100vh - 92px)}
aside.filters{border-right:1px solid var(--line);padding:16px 14px 40px 20px;overflow:auto;position:sticky;top:0;max-height:100vh}
aside.filters summary{display:none}
.fgroup{margin-bottom:18px}
.fgroup h3{font-size:12px;letter-spacing:.04em;color:var(--ink3);margin:0 0 6px;font-weight:700}
.opt{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:4px 7px;border-radius:5px;text-align:left;color:var(--ink)}
.opt:hover{background:var(--line)}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.opt .c{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12px;opacity:.7}
.opt[disabled]{opacity:.35;cursor:default}
.opt .sw{width:12px;height:12px;border-radius:50%;border:1px solid var(--line);flex:none}
.colorrow{display:flex;flex-wrap:wrap;gap:6px}
.colorbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);padding:0}
.colorbtn[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
.shelf{padding:16px 20px 60px;min-width:0}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar input[type=search]{flex:1 1 260px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.count{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px}
.hint{margin:-4px 0 10px;color:var(--ink3);font-size:12px}
.card small.why{color:var(--accent);font-size:11.5px;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;min-height:0}
.chip{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:2px 10px;font-size:12.5px}
.chip.clear{border-color:var(--line);color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:22px 16px}
.card{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .ph{aspect-ratio:2/3;display:flex;align-items:flex-end;justify-content:center}
.card img{max-width:100%;max-height:100%;display:block;box-shadow:0 1px 2px rgba(0,0,0,.22),0 6px 14px rgba(0,0,0,.14);transition:transform .15s}
.card:hover img{transform:translateY(-3px)}
.card b{font-weight:600;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--ink3);font-size:11.5px}
.empty{padding:60px 0;color:var(--ink2);text-align:center}

/* 상세 */
dialog{border:0;padding:0;width:min(920px,calc(100vw - 32px));max-height:calc(100vh - 40px);background:var(--surface);color:var(--ink);border-radius:10px}
dialog::backdrop{background:rgba(10,14,18,.6)}
.det{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:26px;padding:24px;position:relative}
.det img.big{width:100%;display:block;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.det h2{font:700 23px/1.3 var(--serif);margin:0 22px 4px 0}
.det .sub{color:var(--ink2);margin:0 0 12px}
.det .note{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:10px 0 16px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;font-size:13px;margin:0}
.kv dt{color:var(--ink3)} .kv dd{margin:0}
.pal{display:flex;height:26px;border-radius:4px;overflow:hidden;margin:12px 0 4px}
.pal i{display:block;height:100%}
.xbtn{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;line-height:1;color:var(--ink2);padding:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:7px;padding:7px 13px;text-decoration:none;font-size:13px}
.btn.ghost{background:none;color:var(--accent)}
.sim{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:6px}
.sim button{border:0;background:none;padding:0}.sim img{width:100%;display:block}
h4.sh{font-size:12px;color:var(--ink3);margin:16px 0 4px}

/* 스타일 사전 */
.wrap{padding:20px max(20px,env(safe-area-inset-left,0px)) 60px;max-width:1280px}
.intro{max-width:66ch;color:var(--ink2);margin:0 0 20px}
.style{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;padding:22px 0;border-top:1px solid var(--line)}
.style h2{font:700 21px/1.3 var(--serif);margin:0}
.style .n{color:var(--ink3);font-size:13px;font-variant-numeric:tabular-nums}
.style p{margin:6px 0 10px;max-width:60ch}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.tags span{background:var(--accent-soft);border-radius:4px;padding:1px 7px;font-size:12px}
.mini{display:grid;grid-template-columns:96px 1fr 34px;gap:6px;align-items:center;font-size:12px;margin:2px 0}
.mini .tr{height:7px;background:var(--heat0);border-radius:0 4px 4px 0}
.mini .tr i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.mini .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.samples{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end}
.samples button{border:0;background:none;padding:0}
.samples img{width:100%;display:block;box-shadow:0 2px 8px rgba(0,0,0,.18)}

/* 출판사 비교 */
.tblwrap{overflow-x:auto;margin-bottom:8px}
table.heat{border-collapse:separate;border-spacing:2px;font-size:12.5px;min-width:1120px}
table.heat th{font-weight:500;color:var(--ink2);padding:4px 6px;text-align:left}
table.heat thead th{vertical-align:bottom;width:72px;padding:4px 3px;font-size:11.5px;line-height:1.25;word-break:keep-all;text-align:center}
table.heat tbody th{white-space:nowrap;color:var(--ink);font-weight:600;padding-right:12px}
table.heat td{width:72px;height:38px;text-align:center;font-variant-numeric:tabular-nums;border-radius:3px;padding:0}
table.heat td button{width:100%;height:100%;border:0;background:none;color:inherit;border-radius:3px}
.legend{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);margin-bottom:26px}
.legend i{width:26px;height:12px;display:block}
.pubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:26px 30px}
.pub h3{font:700 18px/1.3 var(--serif);margin:0 0 2px}
.pub .meta{color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums;margin-bottom:8px}
.pub p{margin:6px 0 0;font-size:13px;color:var(--ink2)}
.strip{display:flex;height:44px;border-radius:3px;overflow:hidden}
.strip i{flex:1 1 0;display:block;min-width:0}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:5px;font-size:12px;max-width:240px}
footer.src{padding:12px 20px 30px;color:var(--ink3);font-size:12px;border-top:1px solid var(--line)}

@media (max-width:820px){
  .browse{grid-template-columns:1fr}
  aside.filters{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}
  aside.filters summary{display:block;font-weight:700;padding:4px 0;cursor:pointer}
  .det{grid-template-columns:1fr}.style{grid-template-columns:1fr}
  .samples{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  nav.tabs{margin-left:0}
  .shelf{padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>표지 지도 2026</h1>
    <p id="sum"></p>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-v="browse" aria-selected="true">표지 찾기</button>
    <button role="tab" data-v="dict" aria-selected="false">스타일 사전</button>
    <button role="tab" data-v="comp" aria-selected="false">출판사 비교</button>
  </nav>
</header>
<main>
  <section class="view" id="browse">
    <div class="browse">
      <aside class="filters"><details id="fd" open><summary>필터 열기</summary><div class="fbody" id="filters"></div></details></aside>
      <div class="shelf">
        <div class="bar">
          <input type="search" id="q" placeholder="제목, 저자, 소재, 특징으로 찾기 (예: 고양이, 바다, 세로쓰기)" aria-label="검색">
          <select id="sort" aria-label="정렬">
            <option value="date">최신 출간순</option>
            <option value="bright">밝은 표지순</option>
            <option value="dark">어두운 표지순</option>
            <option value="sat">색이 강한 순</option>
            <option value="pub">출판사순</option>
          </select>
          <span class="count" id="count"></span>
        </div>
        <p class="hint">글자로 찾습니다. 제목, 부제, 시리즈, 저자, 분야와 표지 분석 메모(소재·기법·색·분위기)가 대상입니다. 표지 이미지 속 글자를 직접 읽지는 않습니다.</p>
        <div class="chips" id="chips"></div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" hidden>조건에 맞는 표지가 없습니다. 위의 필터를 하나씩 풀어 보세요.</div>
      </div>
    </div>
  </section>
  <section class="view wrap" id="dict" hidden></section>
  <section class="view wrap" id="comp" hidden></section>
</main>
<footer class="src" id="src"></footer>
<dialog id="dlg"></dialog>
<div class="tip" id="tip" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script>APPX.start('cover')</script>
<script type="text/plain" id="app-main">
const {books:B,styles:S,labels:L,pubs:P,pubNotes:PN,meta:META}=window.DATA;
const byId=Object.fromEntries(S.map(s=>[s.id,s]));
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLORS={'흰색':'#f7f7f5','베이지':'#e8dcc0','노랑':'#f2cf3a','주황':'#f08a2c','분홍':'#f09cb5','빨강':'#d3302c','보라':'#7e57c2','파랑':'#2f6fd6','청록':'#23a6a6','초록':'#3f9a57','갈색':'#7b4f2e','회색':'#9aa0a6','검정':'#1c1c1c'};
const FACETS=[
 {k:'style',t:'대표 스타일',f:b=>[b.style],n:v=>byId[v].ko},
 {k:'pub',t:'출판사',f:b=>[b.pub],n:v=>v},
 {k:'catTop',t:'분야',f:b=>[b.catTop],n:v=>v,limit:10},
 {k:'mood',t:'분위기',f:b=>b.mood,n:v=>L.mood[v]||v},
 {k:'medium',t:'표현 기법',f:b=>[b.medium],n:v=>L.medium[v]||v},
 {k:'layout',t:'구도',f:b=>[b.layout],n:v=>L.layout[v]||v},
 {k:'typeface',t:'제목 글꼴',f:b=>[b.typeface],n:v=>L.typeface[v]||v},
];
const state={q:'',qt:[],sort:'date',sel:{},color:new Set()};
FACETS.forEach(f=>state.sel[f.k]=new Set());
function match(b,skip){
  for(const f of FACETS){ if(f.k===skip)continue; const s=state.sel[f.k]; if(s.size&&!f.f(b).some(v=>s.has(v)))return false }
  if(skip!=='color'&&state.color.size&&!b.colorFam.some(c=>state.color.has(c)))return false;
  if(state.qt.length&&!state.qt.every(t=>b._f.some(f=>t(f[2]))))return false;
  return true;
}
B.forEach(b=>{b._f=[['제목',b.title],['부제',b.subtitle],['시리즈',b.series],['저자',b.author],['출판사',b.pub],['분야',b.cat.replace(/>/g,' › ')],['표지 메모',b.note],['스타일',byId[b.style].ko],['소재',(b.motif||[]).join(', ')],['기법',L.medium[b.medium]],['구도',L.layout[b.layout]],['글꼴',L.typeface[b.typeface]],['제목 위치',L.title_pos[b.title_pos]],['분위기',(b.mood||[]).map(m=>L.mood[m]).join(', ')],['색',b.colorFam.join(', ')]].filter(f=>f[1]).map(f=>[f[0],f[1],f[1].toLowerCase()])});
// 영문·숫자 검색어는 낱말 단위로 맞춘다. 그래야 AI가 Again이나 KAIST 안의 글자에 걸리지 않는다.
function compileQ(q){return q.toLowerCase().split(/\s+/).filter(Boolean).map(w=>{if(!/^[a-z0-9]+$/.test(w))return t=>t.includes(w);const re=new RegExp('(^|[^a-z0-9])'+w+(w.length<=3?'(?![a-z0-9])':''));return t=>re.test(t)})}
function why(b){if(!state.qt.length)return '';const seen=new Set();state.qt.forEach(t=>{const f=b._f.find(x=>t(x[2]));if(f)seen.add(f)});const list=[...seen].filter(f=>f[0]!=='제목');return list.length?'<small class="why">'+list.map(f=>esc(f[0])+': '+esc(f[1].length>34?f[1].slice(0,34)+'…':f[1])).join(' / ')+'</small>':''}
function renderFilters(){
  const root=$('#filters'); root.innerHTML='';
  FACETS.forEach(f=>{
    const cnt={}; B.forEach(b=>{if(match(b,f.k))f.f(b).forEach(v=>cnt[v]=(cnt[v]||0)+1)});
    const all={}; B.forEach(b=>f.f(b).forEach(v=>all[v]=(all[v]||0)+1));
    let keys=Object.keys(all).sort((a,c)=>all[c]-all[a]);
    if(f.k==='pub')keys=P;
    if(f.limit)keys=keys.slice(0,f.limit);
    const g=el('div','fgroup','<h3>'+f.t+'</h3>');
    keys.forEach(v=>{const o=el('button','opt',esc(f.n(v))+'<span class="c">'+(cnt[v]||0)+'</span>');
      const on=state.sel[f.k].has(v); o.setAttribute('aria-pressed',on); if(!cnt[v]&&!on)o.disabled=true;
      o.onclick=()=>{on?state.sel[f.k].delete(v):state.sel[f.k].add(v);render()}; g.append(o)});
    root.append(g);
    if(f.k==='pub'){const c=el('div','fgroup','<h3>주요 색</h3>'),r=el('div','colorrow');
      Object.entries(COLORS).forEach(([n,h])=>{const o=el('button','colorbtn');o.style.background=h;o.title=n;o.setAttribute('aria-label',n);o.setAttribute('aria-pressed',state.color.has(n));
        o.onclick=()=>{state.color.has(n)?state.color.delete(n):state.color.add(n);render()};r.append(o)});c.append(r);root.append(c)}
  });
}
function renderChips(){
  const c=$('#chips');c.innerHTML='';let n=0;
  FACETS.forEach(f=>state.sel[f.k].forEach(v=>{n++;const b=el('button','chip',esc(f.n(v))+' ×');b.onclick=()=>{state.sel[f.k].delete(v);render()};c.append(b)}));
  state.color.forEach(v=>{n++;const b=el('button','chip',v+' ×');b.onclick=()=>{state.color.delete(v);render()};c.append(b)});
  if(n){const b=el('button','chip clear','모두 지우기');b.onclick=()=>{resetF();render()};c.append(b)}
}
function resetF(){FACETS.forEach(f=>state.sel[f.k].clear());state.color.clear();state.q='';state.qt=[];$('#q').value=''}
const sorts={date:(a,b)=>b.date.localeCompare(a.date),bright:(a,b)=>b.bright-a.bright,dark:(a,b)=>a.bright-b.bright,sat:(a,b)=>b.sat-a.sat,pub:(a,b)=>P.indexOf(a.pub)-P.indexOf(b.pub)||b.date.localeCompare(a.date)};
function render(){
  const list=B.filter(b=>match(b)).sort(sorts[state.sort]);
  $('#count').textContent=list.length+'종';
  const g=$('#grid');g.innerHTML='';
  const fr=document.createDocumentFragment();
  list.forEach(b=>{const c=el('button','card');
    c.innerHTML='<div class="ph"><img loading="lazy" src="'+MEDIA('covers/'+b.id+'.jpg')+'" alt="'+esc(b.title)+' 표지"></div><b>'+esc(b.title)+'</b><small>'+esc(b.pub)+' · '+esc(byId[b.style].ko)+'</small>'+why(b);
    c.onclick=()=>detail(b);fr.append(c)});
  g.append(fr); $('#empty').hidden=list.length>0;
  renderFilters();renderChips();
}
function detail(b){
  const s=byId[b.style], d=$('#dlg');
  const sim=B.filter(x=>x!==b&&x.style===b.style).map(x=>[x,(x.mood||[]).filter(m=>b.mood.includes(m)).length+(x.medium===b.medium?1:0)+(x.layout===b.layout?1:0)+(x.pub!==b.pub?.5:0)+x.colorFam.filter(c=>b.colorFam.includes(c)).length*.5]).sort((p,q)=>q[1]-p[1]).slice(0,5).map(x=>x[0]);
  const prompt='book-cover-style 스킬로 "'+s.ko+'" 스타일 표지 시안을 만들어 주세요. 제목: (제목) / 저자: (저자) / 내용: (책 소개)';
  d.innerHTML='<div class="det"><button class="xbtn" aria-label="닫기">×</button><div><img class="big" src="'+MEDIA('covers/'+b.id+'.jpg')+'" alt=""></div><div>'+
   '<h2>'+esc(b.title)+'</h2><p class="sub">'+esc(b.subtitle||'')+'</p>'+
   '<p class="note">'+esc(b.note)+'</p>'+
   '<dl class="kv"><dt>출판사</dt><dd>'+esc(b.pub)+(b.series?' · '+esc(b.series):'')+'</dd><dt>저자</dt><dd>'+esc(b.author)+'</dd><dt>출간일</dt><dd>'+esc(b.date)+'</dd><dt>분야</dt><dd>'+esc(b.cat.replace(/>/g,' › '))+'</dd>'+
   '<dt>스타일</dt><dd><b>'+esc(s.ko)+'</b></dd><dt>기법</dt><dd>'+esc(L.medium[b.medium])+' · '+esc(L.layout[b.layout])+'</dd><dt>제목</dt><dd>'+esc(L.typeface[b.typeface])+' · '+esc(L.title_pos[b.title_pos])+'</dd><dt>분위기</dt><dd>'+b.mood.map(m=>esc(L.mood[m])).join(', ')+'</dd><dt>소재</dt><dd>'+esc((b.motif||[]).join(', '))+'</dd></dl>'+
   '<div class="pal">'+b.palette.map(p=>'<i style="background:'+p.hex+';flex:'+p.pct+'" title="'+p.hex+'"></i>').join('')+'</div>'+
   '<div class="acts"><a class="btn" target="_blank" rel="noopener" href="https://www.aladin.co.kr/shop/wproduct.aspx?ItemId='+b.id+'">알라딘에서 보기</a><button class="btn ghost" id="cp">시안 요청 문장 복사</button><button class="btn ghost" id="fs">같은 스타일 모두 보기</button></div>'+
   '<h4 class="sh">비슷한 표지</h4><div class="sim">'+sim.map((x,i)=>'<button data-i="'+i+'"><img src="'+MEDIA('covers/'+x.id+'.jpg')+'" alt="'+esc(x.title)+' 표지"></button>').join('')+'</div></div></div>';
  d.querySelector('.xbtn').onclick=()=>d.close();
  d.querySelectorAll('.sim button').forEach(x=>x.onclick=()=>detail(sim[+x.dataset.i]));
  d.querySelector('#fs').onclick=()=>{d.close();resetF();state.sel.style.add(b.style);show('browse');render()};
  d.querySelector('#cp').onclick=e=>{navigator.clipboard?.writeText(prompt).then(()=>e.target.textContent='복사했습니다').catch(()=>e.target.textContent=prompt)};
  if(!d.open)d.showModal();
}
$('#dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
function renderDict(){
  const r=$('#dict');
  r.innerHTML='<p class="intro">표지 '+B.length+'종을 첫인상을 지배하는 요소로 나눈 14가지 스타일입니다. 많이 쓰인 순서로 놓았습니다. 표지를 누르면 상세 정보가 열립니다.</p>';
  [...S].sort((a,b)=>b.count-a.count).forEach(s=>{
    const list=B.filter(b=>b.style===s.id), c=el('article','style');
    const pc={},cc={}; list.forEach(b=>{pc[b.pub]=(pc[b.pub]||0)+1;cc[b.catTop]=(cc[b.catTop]||0)+1});
    const pubs=Object.entries(pc).sort((a,b)=>b[1]-a[1]).slice(0,4), mx=pubs[0]?pubs[0][1]:1;
    const pick=[...list].sort((a,b)=>(b.sp-a.sp)).filter((b,i,a)=>a.findIndex(x=>x.series&&x.series===b.series)===i||!b.series);
    const seen={},sam=[];pick.forEach(b=>{if(sam.length<6&&(seen[b.pub]||0)<2){seen[b.pub]=(seen[b.pub]||0)+1;sam.push(b)}});pick.forEach(b=>{if(sam.length<6&&!sam.includes(b))sam.push(b)});
    c.innerHTML='<div><h2>'+esc(s.ko)+'</h2><div class="n">'+s.count+'종 · 전체의 '+Math.round(s.count/B.length*100)+'%</div><p>'+esc(s.desc)+'</p>'+
      '<div class="tags">'+Object.entries(cc).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>'<span>'+esc(x[0])+' '+x[1]+'</span>').join('')+'</div>'+
      pubs.map(([p,n])=>'<div class="mini"><span>'+esc(p)+'</span><div class="tr"><i style="width:'+n/mx*100+'%"></i></div><span class="v">'+n+'</span></div>').join('')+
      '<div class="acts"><button class="btn ghost">이 스타일 표지 '+s.count+'종 보기</button></div></div>'+
      '<div class="samples">'+sam.map((b,i)=>'<button data-i="'+i+'"><img loading="lazy" src="'+MEDIA('covers/'+b.id+'.jpg')+'" alt="'+esc(b.title)+' 표지"></button>').join('')+'</div>';
    c.querySelectorAll('.samples button').forEach(x=>x.onclick=()=>detail(sam[+x.dataset.i]));
    c.querySelector('.btn').onclick=()=>{resetF();state.sel.style.add(s.id);show('browse');render()};
    r.append(c);
  });
}
function renderComp(){
  const r=$('#comp'); const order=[...S].sort((a,b)=>b.count-a.count);
  const pct=(p,s)=>{const t=B.filter(b=>b.pub===p).length;return Math.round(B.filter(b=>b.pub===p&&b.style===s).length/t*100)};
  const lv=v=>v===0?0:v<5?1:v<10?2:v<20?3:v<35?4:5;
  let h='<p class="intro">각 칸은 그 출판사 표지 가운데 해당 스타일이 차지하는 비율(%)입니다. 칸을 누르면 그 표지만 모아 봅니다.</p><div class="tblwrap"><table class="heat"><thead><tr><th></th>'+order.map(s=>'<th><span>'+esc(s.ko)+'</span></th>').join('')+'</tr></thead><tbody>';
  P.forEach(p=>{h+='<tr><th scope="row">'+esc(p)+'</th>'+order.map(s=>{const v=pct(p,s.id),l=lv(v);return '<td style="background:var(--heat'+l+');color:'+(l>=4?'var(--bg)':'var(--ink)')+'"><button data-p="'+esc(p)+'" data-s="'+s.id+'" data-t="'+esc(p)+' · '+esc(s.ko)+': '+v+'%">'+(v||'')+'</button></td>'}).join('')+'</tr>'});
  h+='</tbody></table></div><div class="legend"><span>0%</span>'+[0,1,2,3,4,5].map(i=>'<i style="background:var(--heat'+i+')"></i>').join('')+'<span>35% 이상</span></div><div class="pubs">';
  P.forEach(p=>{const L2=B.filter(b=>b.pub===p);
    const top=Object.entries(L2.reduce((a,b)=>(a[b.style]=(a[b.style]||0)+1,a),{})).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const ms=(k)=>(L2.reduce((a,b)=>a+b[k],0)/L2.length*100).toFixed(0);
    const hue=x=>{const c=parseInt(x.slice(1),16),R=c>>16,G=c>>8&255,Bl=c&255,mx=Math.max(R,G,Bl),mn=Math.min(R,G,Bl);if(mx-mn<24)return 400+mx/255*100;let hh=mx===R?(G-Bl)/(mx-mn):mx===G?2+(Bl-R)/(mx-mn):4+(R-G)/(mx-mn);return (hh*60+360)%360};
    const cols=L2.map(b=>b.palette[0].hex).sort((a,c)=>hue(a)-hue(c));
    h+='<div class="pub"><h3>'+esc(p)+'</h3><div class="meta">'+L2.length+'종 · 평균 밝기 '+ms('bright')+' · 평균 채도 '+ms('sat')+'</div><div class="strip" title="표지마다 가장 넓은 색 한 가지를 색상 순으로 늘어놓았습니다">'+cols.map(c=>'<i style="background:'+c+'"></i>').join('')+'</div><div class="tags">'+top.map(t=>'<span>'+esc(byId[t[0]].ko)+' '+t[1]+'</span>').join('')+'</div><p>'+esc(PN[p]||'')+'</p></div>'});
  r.innerHTML=h+'</div>';
  const tip=$('#tip');
  r.querySelectorAll('td button').forEach(b=>{
    b.onmousemove=e=>{tip.hidden=false;tip.textContent=b.dataset.t;tip.style.left=Math.min(e.clientX+12,innerWidth-250)+'px';tip.style.top=e.clientY+14+'px'};
    b.onmouseleave=()=>tip.hidden=true;
    b.onclick=()=>{tip.hidden=true;resetF();state.sel.pub.add(b.dataset.p);state.sel.style.add(b.dataset.s);show('browse');render()}});
}
function show(v){document.querySelectorAll('.view').forEach(x=>x.hidden=x.id!==v);document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));scrollTo(0,0)}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.v));
$('#q').oninput=e=>{state.q=e.target.value.trim();state.qt=compileQ(state.q);render()};
$('#sort').onchange=e=>{state.sort=e.target.value;render()};
$('#sum').textContent=B.length+'종 · 출판사 '+P.length+'곳 · '+META.range;
$('#src').textContent=META.source;
renderDict();renderComp();render();
if(matchMedia('(max-width:820px)').matches)$('#fd').open=false;
const h0=location.hash.slice(1);if(h0==='dict'||h0==='comp')show(h0);
</script>

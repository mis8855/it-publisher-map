<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>상세페이지 지도 2026</title>
<style>
/* 배치 개념: 표지 지도와 같은 무채색 바탕. 세로로 긴 상세페이지는 첫 화면만 카드로 보이고, 누르면 오른쪽 전체를 스크롤한다 */
:root{
  --bg:#eceef0; --surface:#f8f9fa; --line:#d5d9dd; --ink:#15191e; --ink2:#4d555e; --ink3:#747d87;
  --accent:#0b5c6b; --accent-soft:#d6e7ea; --on-accent:#ffffff;
  --heat0:#edf3f4; --heat1:#c2dbdf; --heat2:#8abcc4; --heat3:#4e98a5; --heat4:#1f7384; --heat5:#0b5163;
  --serif:"Noto Serif KR","AppleMyungjo","Nanum Myeongjo",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171a; --surface:#1c2024; --line:#30363c; --ink:#eef0f2; --ink2:#b3bac2; --ink3:#8a929b;
  --accent:#6cc4d3; --accent-soft:#17383f; --on-accent:#08242a;
  --heat0:#1c2529; --heat1:#1d3a42; --heat2:#1f5664; --heat3:#2c7b8c; --heat4:#52a5b5; --heat5:#90d0db; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171a; --surface:#1c2024; --line:#30363c; --ink:#eef0f2; --ink2:#b3bac2; --ink3:#8a929b;
  --accent:#6cc4d3; --accent-soft:#17383f; --on-accent:#08242a;
  --heat0:#1c2529; --heat1:#1d3a42; --heat2:#1f5664; --heat3:#2c7b8c; --heat4:#52a5b5; --heat5:#90d0db; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;padding:20px max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.brand h1{font:700 26px/1.2 var(--serif);margin:0;letter-spacing:-.01em}
.brand p{margin:3px 0 12px;color:var(--ink2);font-size:13px}
nav.tabs{display:flex;gap:2px;margin-left:auto}
nav.tabs button{border:0;background:none;padding:9px 16px;border-bottom:3px solid transparent;color:var(--ink2);font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.view[hidden]{display:none}
.browse{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100vh - 92px)}
aside.filters{border-right:1px solid var(--line);padding:16px 14px 40px max(20px,env(safe-area-inset-left,0px));overflow:auto;position:sticky;top:0;max-height:100vh}
aside.filters summary{display:none}
.fgroup{margin-bottom:18px}
.fgroup h3{font-size:12px;letter-spacing:.04em;color:var(--ink3);margin:0 0 6px;font-weight:700}
.opt{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:4px 7px;border-radius:5px;text-align:left;color:var(--ink)}
.opt:hover{background:var(--line)}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.opt .c{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12px;opacity:.7}
.opt[disabled]{opacity:.35;cursor:default}
.shelf{padding:16px max(20px,env(safe-area-inset-right,0px)) 60px 20px;min-width:0}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.bar input[type=search]{flex:1 1 260px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.count{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px}
.hint{margin:0 0 10px;color:var(--ink3);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:2px 10px;font-size:12.5px}
.chip.clear{border-color:var(--line);color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:24px 16px}
.card{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.card .ph{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.2),0 6px 14px rgba(0,0,0,.12);background:var(--surface)}
.card .ph img{width:100%;display:block;transition:transform .15s}
.card:hover .ph img{transform:translateY(-2px)}
.card .len{position:absolute;right:6px;bottom:6px;background:rgba(15,20,24,.78);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.card b{font-weight:600;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--ink3);font-size:11.5px}
.card q{font-size:12px;color:var(--ink2);quotes:"“" "”";display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small.why{color:var(--accent)}
.empty{padding:60px 0;color:var(--ink2);text-align:center}
dialog{border:0;padding:0;width:min(1080px,calc(100vw - 32px));height:calc(100vh - 40px);max-height:calc(100vh - 40px);background:var(--surface);color:var(--ink);border-radius:10px}
dialog::backdrop{background:rgba(10,14,18,.6)}
.det{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);height:100%;position:relative}
.det .long{overflow-y:auto;background:var(--bg);display:flex;justify-content:center;align-items:flex-start;padding:18px}
.det .long img{width:min(100%,560px);height:auto;display:block;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.det .side{overflow-y:auto;padding:24px 22px;border-left:1px solid var(--line)}
.det h2{font:700 21px/1.3 var(--serif);margin:0 26px 4px 0}
.det .sub{color:var(--ink2);margin:0 0 12px;font-size:13px}
.det .cover{display:flex;gap:12px;align-items:flex-end;margin:6px 0 14px}
.det .cover img{width:84px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.det blockquote{margin:0 0 14px;padding:4px 0 4px 12px;border-left:3px solid var(--accent);font:600 15px/1.45 var(--serif)}
.kv{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;font-size:13px;margin:0}
.kv dt{color:var(--ink3)} .kv dd{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.tags span{background:var(--accent-soft);border-radius:4px;padding:1px 7px;font-size:12px}
.xbtn{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;line-height:1;color:var(--ink2);padding:6px;z-index:2}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:7px;padding:7px 13px;text-decoration:none;font-size:13px}
.btn.ghost{background:none;color:var(--accent)}
.also{font-size:12.5px;color:var(--ink2);margin-top:10px}
.wrap{padding:20px max(20px,env(safe-area-inset-right,0px)) 60px max(20px,env(safe-area-inset-left,0px));max-width:1280px}
.intro{max-width:70ch;color:var(--ink2);margin:0 0 20px}
h2.sec{font:700 19px/1.3 var(--serif);margin:28px 0 10px}
.tblwrap{overflow-x:auto;margin-bottom:8px}
table.heat{border-collapse:separate;border-spacing:2px;font-size:12.5px}
table.heat th{font-weight:500;color:var(--ink2);padding:4px 6px;text-align:left}
table.heat thead th{vertical-align:bottom;width:74px;padding:4px 3px;font-size:11.5px;line-height:1.25;word-break:keep-all;text-align:center}
table.heat tbody th{white-space:nowrap;color:var(--ink);font-weight:600;padding-right:12px}
table.heat td{width:74px;height:36px;text-align:center;font-variant-numeric:tabular-nums;border-radius:3px;padding:0}
table.heat td button{width:100%;height:100%;border:0;background:none;color:inherit;border-radius:3px}
.legend{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);margin-bottom:22px}
.legend i{width:26px;height:12px;display:block}
.cov{display:grid;grid-template-columns:110px minmax(0,1fr) 120px;gap:8px 12px;align-items:center;max-width:760px;font-size:13px}
.cov .tr{height:14px;background:var(--heat0);border-radius:0 4px 4px 0;overflow:hidden}
.cov .tr i{display:block;height:100%;background:var(--accent)}
.cov .v{font-variant-numeric:tabular-nums;color:var(--ink2)}
.firsts{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:26px 30px}
.firsts h3{font:700 17px/1.3 var(--serif);margin:0}
.firsts .n{color:var(--ink3);font-size:12.5px}
.firsts p{margin:4px 0 8px;font-size:13px;color:var(--ink2)}
.samples{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.samples button{border:0;background:none;padding:0;aspect-ratio:3/4;overflow:hidden;border-radius:3px}
.samples img{width:100%;display:block}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:5px;font-size:12px;max-width:240px}
footer.src{padding:12px max(20px,env(safe-area-inset-right,0px)) 30px max(20px,env(safe-area-inset-left,0px));color:var(--ink3);font-size:12px;border-top:1px solid var(--line)}
@media (max-width:820px){
  .browse{grid-template-columns:1fr}
  aside.filters{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
  aside.filters summary{display:block;font-weight:700;padding:4px 0;cursor:pointer}
  .det{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow-y:auto}
  .det .side{border-left:0;order:-1}
  .det .long{overflow:visible}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  nav.tabs{margin-left:0}
  .shelf{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .samples{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>상세페이지 지도 2026</h1><p id="sum"></p></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-v="browse" aria-selected="true">홍보 이미지 찾기</button>
    <button role="tab" data-v="parts" aria-selected="false">구성 분석</button>
    <button role="tab" data-v="comp" aria-selected="false">출판사 비교</button>
  </nav>
</header>
<main>
  <section class="view" id="browse">
    <div class="browse">
      <aside class="filters"><details id="fd" open><summary>필터 열기</summary><div id="filters"></div></details></aside>
      <div class="shelf">
        <div class="bar">
          <input type="search" id="q" placeholder="제목, 헤드카피, 특징으로 찾기 (예: 추천사, 수상, 굿즈)" aria-label="검색">
          <select id="sort" aria-label="정렬">
            <option value="date">최신 출간순</option>
            <option value="long">긴 상세페이지순</option>
            <option value="short">짧은 상세페이지순</option>
            <option value="sec">구획 많은 순</option>
            <option value="pub">출판사순</option>
          </select>
          <span class="count" id="count"></span>
        </div>
        <p class="hint">글자로 찾습니다. 제목, 저자, 분야, 첫 화면 헤드카피, 분석 메모와 구성 요소가 대상입니다. 카드 오른쪽 아래 숫자는 휴대폰 화면 기준 길이입니다.</p>
        <div class="chips" id="chips"></div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" hidden>조건에 맞는 홍보 이미지가 없습니다. 필터를 하나씩 풀어 보세요.</div>
      </div>
    </div>
  </section>
  <section class="view wrap" id="parts" hidden></section>
  <section class="view wrap" id="comp" hidden></section>
</main>
<footer class="src" id="src"></footer>
<dialog id="dlg"></dialog>
<div class="tip" id="tip" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script>APPX.start('promo')</script>
<script type="text/plain" id="app-main">
const D=window.DATA, I=D.imgs, BK=D.books, L=D.labels, P=D.pubs;
const IMG=window.PROMO_SRC||(f=>'promo/'+f), TH=window.THUMB_SRC||(f=>'thumbs/'+f), CV=window.COVER_SRC||(id=>'../대시보드/covers/'+id+'.jpg');
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LEN=[['~3화면',0,3],['3~5화면',3,5],['5~8화면',5,8],['8화면 이상',8,1e9]];
const lenBin=x=>LEN.find(b=>x.screens>=b[1]&&x.screens<b[2])[0];
const FACETS=[
 {k:'pub',t:'출판사',f:x=>[x.pub],n:v=>v,order:P},
 {k:'first',t:'첫 화면 유형',f:x=>[x.first],n:v=>L.first[v]},
 {k:'parts',t:'구성 요소',f:x=>x.parts,n:v=>L.parts[v],all:true},
 {k:'tone',t:'톤',f:x=>[x.tone],n:v=>L.tone[v]},
 {k:'len',t:'길이',f:x=>[lenBin(x)],n:v=>v,order:LEN.map(b=>b[0])},
 {k:'catTop',t:'분야',f:x=>[x.catTop],n:v=>v,limit:10},
 {k:'cstyle',t:'표지 스타일(표지 지도 기준)',f:x=>[x.cstyle],n:v=>L.cstyle[v]||v},
];
const state={qt:[],q:'',sort:'date',sel:{}};FACETS.forEach(f=>state.sel[f.k]=new Set());
I.forEach(x=>{const b=BK[x.books[0]];x.title=b.title;x.date=b.date;x.catTop=b.catTop;x.cstyle=b.style;
  x._f=[['제목',x.books.map(id=>BK[id].title).join(' / ')],['저자',b.author],['분야',b.cat.replace(/>/g,' › ')],['헤드카피',x.copy],['분석 메모',x.note],['구성',x.parts.map(p=>L.parts[p]).join(', ')],['첫 화면',L.first[x.first]],['톤',L.tone[x.tone]],['출판사',x.pub]].filter(f=>f[1]).map(f=>[f[0],f[1],f[1].toLowerCase()])});
function compileQ(q){return q.toLowerCase().split(/\s+/).filter(Boolean).map(w=>{if(!/^[a-z0-9]+$/.test(w))return t=>t.includes(w);const re=new RegExp('(^|[^a-z0-9])'+w+(w.length<=3?'(?![a-z0-9])':''));return t=>re.test(t)})}
function match(x,skip){
  for(const f of FACETS){if(f.k===skip)continue;const s=state.sel[f.k];if(!s.size)continue;const v=f.f(x);if(f.all?![...s].every(a=>v.includes(a)):!v.some(a=>s.has(a)))return false}
  if(state.qt.length&&!state.qt.every(t=>x._f.some(f=>t(f[2]))))return false;return true}
function why(x){if(!state.qt.length)return '';const s=new Set();state.qt.forEach(t=>{const f=x._f.find(y=>t(y[2]));if(f)s.add(f)});const l=[...s].filter(f=>f[0]!=='제목'&&f[0]!=='헤드카피');return l.length?'<small class="why">'+l.map(f=>esc(f[0])+': '+esc(f[1].length>30?f[1].slice(0,30)+'…':f[1])).join(' / ')+'</small>':''}
function resetF(){FACETS.forEach(f=>state.sel[f.k].clear());state.q='';state.qt=[];$('#q').value=''}
function renderFilters(){const root=$('#filters');root.innerHTML='';
  FACETS.forEach(f=>{const cnt={},all={};I.forEach(x=>{f.f(x).forEach(v=>all[v]=(all[v]||0)+1);if(match(x,f.k))f.f(x).forEach(v=>cnt[v]=(cnt[v]||0)+1)});
    let keys=f.order||Object.keys(all).sort((a,b)=>all[b]-all[a]);if(f.limit)keys=keys.slice(0,f.limit);
    const g=el('div','fgroup','<h3>'+f.t+(f.all?' (모두 포함)':'')+'</h3>');
    keys.forEach(v=>{const on=state.sel[f.k].has(v),o=el('button','opt',esc(f.n(v))+'<span class="c">'+(cnt[v]||0)+'</span>');o.setAttribute('aria-pressed',on);if(!cnt[v]&&!on)o.disabled=true;o.onclick=()=>{on?state.sel[f.k].delete(v):state.sel[f.k].add(v);render()};g.append(o)});root.append(g)})}
function renderChips(){const c=$('#chips');c.innerHTML='';let n=0;
  FACETS.forEach(f=>state.sel[f.k].forEach(v=>{n++;const b=el('button','chip',esc(f.n(v))+' ×');b.onclick=()=>{state.sel[f.k].delete(v);render()};c.append(b)}));
  if(n){const b=el('button','chip clear','모두 지우기');b.onclick=()=>{FACETS.forEach(f=>state.sel[f.k].clear());render()};c.append(b)}}
const sorts={date:(a,b)=>b.date.localeCompare(a.date),long:(a,b)=>b.screens-a.screens,short:(a,b)=>a.screens-b.screens,sec:(a,b)=>b.sections-a.sections,pub:(a,b)=>P.indexOf(a.pub)-P.indexOf(b.pub)||b.date.localeCompare(a.date)};
function render(){const list=I.filter(x=>match(x)).sort(sorts[state.sort]);$('#count').textContent=list.length+'장';
  const g=$('#grid');g.innerHTML='';const fr=document.createDocumentFragment();
  list.forEach(x=>{const c=el('button','card');
    c.innerHTML='<div class="ph"><img loading="lazy" src="'+TH(x.file)+'" alt="'+esc(x.title)+' 상세페이지 첫 화면"><span class="len">'+x.screens.toFixed(1)+'화면</span></div><b>'+esc(x.title)+(x.books.length>1?' 외 '+(x.books.length-1)+'종':'')+'</b><small>'+esc(x.pub)+' · '+esc(L.first[x.first])+'</small>'+(x.copy?'<q>'+esc(x.copy)+'</q>':'')+why(x);
    c.onclick=()=>detail(x);fr.append(c)});
  g.append(fr);$('#empty').hidden=list.length>0;renderFilters();renderChips()}
function detail(x){const d=$('#dlg'),b=BK[x.books[0]];
  d.innerHTML='<div class="det"><button class="xbtn" aria-label="닫기">×</button><div class="long"><img src="'+IMG(x.file)+'" alt="'+esc(x.title)+' 상세페이지 전체"></div><div class="side">'+
   '<h2>'+esc(b.title)+'</h2><p class="sub">'+esc(b.author)+' · '+esc(x.pub)+' · '+esc(b.date)+'</p>'+
   '<div class="cover"><img src="'+CV(b.id)+'" alt="표지"><small style="color:var(--ink3)">표지 스타일<br><b style="color:var(--ink)">'+esc(L.cstyle[b.style]||'')+'</b></small></div>'+
   (x.copy?'<blockquote>'+esc(x.copy)+'</blockquote>':'')+
   '<dl class="kv"><dt>첫 화면</dt><dd>'+esc(L.first[x.first])+'</dd><dt>톤</dt><dd>'+esc(L.tone[x.tone])+'</dd><dt>길이</dt><dd>휴대폰 '+x.screens.toFixed(1)+'화면 · 구획 '+x.sections+'개</dd><dt>원본</dt><dd>'+x.w+'×'+x.h+'px</dd><dt>분야</dt><dd>'+esc(b.cat.replace(/>/g,' › '))+'</dd></dl>'+
   '<div class="tags">'+x.parts.map(p=>'<span>'+esc(L.parts[p])+'</span>').join('')+'</div>'+
   '<p style="margin:10px 0 0">'+esc(x.note)+'</p>'+
   (x.books.length>1?'<p class="also">같은 이미지를 쓰는 도서 '+x.books.length+'종: '+x.books.map(id=>esc(BK[id].title)).join(', ')+'</p>':'')+
   '<div class="acts"><a class="btn" target="_blank" rel="noopener" href="https://www.aladin.co.kr/shop/wproduct.aspx?ItemId='+b.id+'">알라딘에서 보기</a><button class="btn ghost" id="fs">같은 첫 화면 유형 보기</button></div></div></div>';
  d.querySelector('.xbtn').onclick=()=>d.close();
  d.querySelector('#fs').onclick=()=>{d.close();resetF();state.sel.first.add(x.first);show('browse');render()};
  if(!d.open)d.showModal();d.querySelector('.long').scrollTop=0}
$('#dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
const heatCls=v=>v===0?0:v<10?1:v<25?2:v<45?3:v<65?4:5;
function heatTable(rows,cols,val,colName,onClick){let h='<div class="tblwrap"><table class="heat"><thead><tr><th></th>'+cols.map(c=>'<th>'+esc(colName(c))+'</th>').join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{h+='<tr><th scope="row">'+esc(r)+'</th>'+cols.map(c=>{const v=val(r,c),l=heatCls(v);return '<td style="background:var(--heat'+l+');color:'+(l>=4?'var(--bg)':'var(--ink)')+'"><button data-r="'+esc(r)+'" data-c="'+esc(c)+'" data-t="'+esc(r)+' · '+esc(colName(c))+': '+v+'%">'+(v||'')+'</button></td>'}).join('')+'</tr>'});
  return h+'</tbody></table></div><div class="legend"><span>0%</span>'+[0,1,2,3,4,5].map(i=>'<i style="background:var(--heat'+i+')"></i>').join('')+'<span>65% 이상</span></div>'}
function wireHeat(root,onClick){const tip=$('#tip');root.querySelectorAll('td button').forEach(b=>{b.onmousemove=e=>{tip.hidden=false;tip.textContent=b.dataset.t;tip.style.left=Math.min(e.clientX+12,innerWidth-250)+'px';tip.style.top=e.clientY+14+'px'};b.onmouseleave=()=>tip.hidden=true;b.onclick=()=>{tip.hidden=true;onClick(b.dataset.r,b.dataset.c)}})}
function renderParts(){const r=$('#parts');const tot=I.length;
  const pc={};I.forEach(x=>x.parts.forEach(p=>pc[p]=(pc[p]||0)+1));const keys=Object.keys(L.parts).sort((a,b)=>(pc[b]||0)-(pc[a]||0));const mx=Math.max(...Object.values(pc));
  let h='<p class="intro">상세페이지 '+tot+'장을 첫 화면 유형과 구성 요소로 나눴습니다. 구성 요소는 한 장에 여러 개가 들어갑니다. 막대를 누르면 그 요소가 들어간 이미지만 모아 봅니다.</p><h2 class="sec">어떤 구획을 넣는가</h2><div class="cov">';
  keys.forEach(k=>{const n=pc[k]||0;h+='<span>'+esc(L.parts[k])+'</span><button class="tr" data-p="'+k+'" style="border:0;padding:0;cursor:pointer" aria-label="'+esc(L.parts[k])+' 보기"><i style="width:'+n/mx*100+'%"></i></button><span class="v">'+n+'장 · '+Math.round(n/tot*100)+'%</span>'});
  h+='</div><h2 class="sec">첫 화면을 무엇으로 여는가</h2><div class="firsts">';
  Object.keys(L.first).forEach(k=>{const list=I.filter(x=>x.first===k);if(!list.length)return;const sam=[...list].sort((a,b)=>b.date.localeCompare(a.date)).filter((x,i,a)=>a.findIndex(y=>y.pub===x.pub)===i).concat(list).filter((x,i,a)=>a.indexOf(x)===i).slice(0,4);
    h+='<div><h3>'+esc(L.first[k])+'</h3><div class="n">'+list.length+'장 · '+Math.round(list.length/tot*100)+'%</div><p>'+esc(L.firstDesc[k])+'</p><div class="samples">'+sam.map(x=>'<button data-f="'+x.file+'"><img loading="lazy" src="'+TH(x.file)+'" alt="'+esc(x.title)+'"></button>').join('')+'</div></div>'});
  r.innerHTML=h+'</div>';
  r.querySelectorAll('.cov button').forEach(b=>b.onclick=()=>{resetF();state.sel.parts.add(b.dataset.p);show('browse');render()});
  r.querySelectorAll('.samples button').forEach(b=>b.onclick=()=>detail(I.find(x=>x.file===b.dataset.f)))}
function renderComp(){const r=$('#comp');
  let h='<p class="intro">출판사별로 홍보 이미지를 얼마나 붙였는지, 어떤 구획을 즐겨 쓰는지 비교합니다. 칸을 누르면 그 이미지만 모아 봅니다.</p><h2 class="sec">홍보 이미지를 붙인 도서 비율</h2><div class="cov">';
  P.forEach(p=>{const c=D.coverage[p];h+='<span>'+esc(p)+'</span><div class="tr"><i style="width:'+c.with/c.total*100+'%"></i></div><span class="v">'+c.with+' / '+c.total+'종</span>'});
  h+='</div><h2 class="sec">구성 요소 사용 비율 (%)</h2>';
  const pk=Object.keys(L.parts);const pct=(p,f)=>{const a=I.filter(x=>x.pub===p);return a.length?Math.round(a.filter(f).length/a.length*100):0};
  h+=heatTable(P,pk,(p,k)=>pct(p,x=>x.parts.includes(k)),k=>L.parts[k]);
  h+='<h2 class="sec">첫 화면 유형 비율 (%)</h2>'+heatTable(P,Object.keys(L.first),(p,k)=>pct(p,x=>x.first===k),k=>L.first[k]);
  h+='<h2 class="sec">톤 비율 (%)</h2>'+heatTable(P,Object.keys(L.tone),(p,k)=>pct(p,x=>x.tone===k),k=>L.tone[k]);
  h+='<h2 class="sec">평균 길이</h2><div class="cov">';const ml=Math.max(...P.map(p=>{const a=I.filter(x=>x.pub===p);return a.length?a.reduce((s,x)=>s+x.screens,0)/a.length:0}));
  P.forEach(p=>{const a=I.filter(x=>x.pub===p);const v=a.length?a.reduce((s,x)=>s+x.screens,0)/a.length:0;h+='<span>'+esc(p)+'</span><div class="tr"><i style="width:'+v/ml*100+'%"></i></div><span class="v">'+v.toFixed(1)+'화면</span>'});
  r.innerHTML=h+'</div>';
  const tables=r.querySelectorAll('.tblwrap');const keysets=['parts','first','tone'];
  tables.forEach((t,i)=>wireHeat(t,(p,k)=>{resetF();state.sel.pub.add(p);state.sel[keysets[i]].add(k);show('browse');render()}))}
function show(v){document.querySelectorAll('.view').forEach(x=>x.hidden=x.id!==v);document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));scrollTo(0,0)}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.v));
$('#q').oninput=e=>{state.q=e.target.value.trim();state.qt=compileQ(state.q);render()};
$('#sort').onchange=e=>{state.sort=e.target.value;render()};
$('#sum').textContent='홍보 이미지 '+I.length+'장 · 도서 '+D.meta.bookCount+'종 · 조사 대상 '+D.meta.total+'종 중';
$('#src').textContent=D.meta.source;
renderParts();renderComp();render();
if(matchMedia('(max-width:820px)').matches)$('#fd').open=false;
const h0=location.hash.slice(1);if(h0==='parts'||h0==='comp')show(h0);
</script>
</body>
